<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account | BIODUN STYLE GRID</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-bsg border-bottom">
    <div class="container">
      <a class="navbar-brand me-4" href="index.html">
        <img src="assets/logo.svg" alt="BIODUN STYLE GRID" height="42">
      </a>
      <div class="d-flex align-items-center gap-2 d-lg-none ms-auto me-2">
        <a href="cart.html" class="btn btn-link text-dark p-1 position-relative">
          <i class="bi bi-bag fs-5"></i>
          <span class="cart-count-badge position-absolute top-0 start-100 translate-middle">0</span>
        </a>
      </div>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#bsgNavMenu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="bsgNavMenu">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0 text-center">
          <li class="nav-item"><a class="nav-link nav-link-bsg" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link nav-link-bsg" href="shop.html">Shop</a></li>
          <li class="nav-item"><a class="nav-link nav-link-bsg" href="collections.html">Collections</a></li>
          <li class="nav-item"><a class="nav-link nav-link-bsg" href="about.html">About</a></li>
        </ul>
        <div class="d-none d-lg-flex align-items-center gap-3">
          <button onclick="logoutUser()" class="btn btn-outline-danger btn-sm">Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Profile Content -->
  <section class="py-5">
    <div class="container">
      <div class="row g-4 mb-5" id="accountProfileCard">
        <!-- Rendered dynamically -->
      </div>

      <h4 class="font-heading mb-3"><i class="bi bi-receipt me-2 text-bsg-burgundy"></i> ORDER HISTORY</h4>
      <div class="bg-white border rounded p-4" id="accountOrdersList">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer-bsg">
    <div class="container text-center small text-muted">
      <p class="mb-0">© 2026 BIODUN STYLE GRID (BSG). Prototype Netlify Build.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = getCurrentUser();
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      const isAdmin = user.role === 'admin' || user.email.toLowerCase().includes('admin');

      // Render User Profile Card
      document.getElementById('accountProfileCard').innerHTML = `
        <div class="col-md-8">
          <div class="bg-white border rounded p-4 d-flex align-items-center gap-4">
            <div class="rounded-circle bg-bsg-burgundy text-white d-flex align-items-center justify-content-center display-5 fw-bold" style="width: 70px; height: 70px;">
              ${user.firstName.charAt(0)}
            </div>
            <div>
              <h3 class="font-heading mb-1">${user.name}</h3>
              <p class="text-muted small mb-1"><i class="bi bi-envelope me-1"></i> ${user.email} | <i class="bi bi-telephone me-1"></i> ${user.phone}</p>
              <span class="badge ${isAdmin ? 'bg-bsg-burgundy text-white' : 'bg-bsg-gold text-dark'}">${isAdmin ? 'BSG Store Admin' : 'BSG Valued Client'}</span>
            </div>
          </div>
        </div>
        <div class="col-md-4 text-md-end d-flex align-items-center justify-content-md-end gap-2">
          ${isAdmin ? `<a href="admin.html" class="btn btn-bsg-primary"><i class="bi bi-shield-lock me-1"></i> Admin Portal</a>` : ''}
          <button onclick="logoutUser()" class="btn btn-bsg-secondary"><i class="bi bi-box-arrow-right me-1"></i> Log Out</button>
        </div>
      `;

      // Render Orders
      const orders = JSON.parse(localStorage.getItem('bsg_orders')) || [];
      const ordersList = document.getElementById('accountOrdersList');

      if (orders.length === 0) {
        ordersList.innerHTML = `<p class="text-muted mb-0 text-center py-4">No order history found yet. Browse our store to place your first native wear order!</p>`;
      } else {
        ordersList.innerHTML = orders.map(o => `
          <div class="border-bottom pb-3 mb-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <strong class="font-heading text-bsg-burgundy">${o.orderRef}</strong>
              <span class="badge bg-success">${o.paymentStatus}</span>
            </div>
            <div class="small text-muted mb-2">Date: ${o.date} | Total: <strong class="text-dark">₦${o.total.toLocaleString()}</strong></div>
            <div class="small text-dark">
              Items: ${o.items.map(i => `${i.name} (Size: ${i.size}, Qty: ${i.qty})`).join(', ')}
            </div>
          </div>
        `).join('');
      }
    });
  </script>
</body>
</html>
