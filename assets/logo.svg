<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bsgGoldSymbol" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DAB66E"/>
      <stop offset="50%" stop-color="#B98B36"/>
      <stop offset="100%" stop-color="#8F631C"/>
    </linearGradient>
  </defs>

  <!-- Clean Intertwined BS Monogram Emblem ONLY (No lettering) -->
  <g transform="translate(10, 7)">
    <!-- B Stem with top and bottom serifs -->
    <path d="M 12 5 L 24 5 L 24 85 L 12 85 Z" fill="url(#bsgGoldSymbol)"/>
    <path d="M 8 5 L 34 5 L 34 11 L 8 11 Z" fill="url(#bsgGoldSymbol)"/>
    <path d="M 8 79 L 34 79 L 34 85 L 8 85 Z" fill="url(#bsgGoldSymbol)"/>

    <!-- Top & Bottom B curves interlocked with S -->
    <path d="M 24 5 C 60 5, 75 22, 58 42 C 45 50, 32 46, 24 46 Z" fill="none" stroke="url(#bsgGoldSymbol)" stroke-width="6"/>
    <path d="M 24 44 C 40 44, 78 46, 72 70 C 66 90, 38 88, 24 85 Z" fill="none" stroke="url(#bsgGoldSymbol)" stroke-width="6"/>
    
    <!-- S Loop overlay -->
    <path d="M 46 16 C 68 14, 70 34, 46 44 C 28 50, 30 74, 58 72" fill="none" stroke="url(#bsgGoldSymbol)" stroke-width="5.5" stroke-linecap="round"/>
  </g>
</svg>
