<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login | BIODUN STYLE GRID</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
</head>
<body class="bg-bsg-bg-light">

  <nav class="navbar navbar-bsg border-bottom">
    <div class="container justify-content-between">
      <a class="navbar-brand" href="index.html">
        <img src="assets/logo.svg" alt="BIODUN STYLE GRID" height="40">
      </a>
      <a href="shop.html" class="btn btn-bsg-secondary btn-sm">Back to Store</a>
    </div>
  </nav>

  <section class="py-5">
    <div class="container" style="max-width: 440px;">
      <div class="bg-white border rounded p-4 p-md-5 shadow-sm">
        
        <div class="text-center mb-4">
          <h2 class="font-heading mb-1">CUSTOMER LOGIN</h2>
          <p class="text-muted small">Sign in to your BIODUN STYLE GRID account</p>
        </div>

        <form id="bsgLoginForm">
          <div class="mb-3">
            <label class="form-label font-heading small fw-bold">Email Address *</label>
            <input type="email" id="loginEmail" class="form-control" required placeholder="name@example.com">
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between">
              <label class="form-label font-heading small fw-bold">Password *</label>
              <a href="#" onclick="alert('Forgot password simulation: Check your registered email.')" class="small text-bsg-burgundy">Forgot Password?</a>
            </div>
            <input type="password" id="loginPassword" class="form-control" required placeholder="••••••••">
          </div>

          <button type="submit" class="btn btn-bsg-primary w-100 py-3 fw-bold mb-3">
            LOGIN
          </button>
        </form>

        <div class="text-center pt-3 border-top small">
          <span class="text-muted">Don't have an account?</span>
          <a href="register.html" class="fw-bold text-bsg-burgundy ms-1">Create Account</a>
        </div>
        <div class="text-center pt-3 mt-2 border-top small">
          <span class="text-muted">Store Staff or Administrator?</span>
          <a href="admin.html" class="fw-bold text-dark ms-1"><i class="bi bi-shield-lock me-1"></i> Admin Portal</a>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>

  <script>
    document.getElementById('bsgLoginForm')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPassword').value;

      const res = loginUser(email, pass);
      if (res.success) {
        showBsgToast("Welcome back, " + res.user.firstName + "!", "success");
        setTimeout(() => window.location.href = 'account.html', 800);
      } else {
        showBsgToast(res.message, "danger");
      }
    });
  </script>
</body>
</html>
