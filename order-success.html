<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed | BIODUN STYLE GRID</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-bsg border-bottom">
    <div class="container justify-content-between">
      <a class="navbar-brand" href="index.html">
        <img src="assets/logo.svg" alt="BIODUN STYLE GRID" height="40">
      </a>
      <a href="shop.html" class="btn btn-bsg-secondary btn-sm">Continue Shopping</a>
    </div>
  </nav>

  <!-- Confirmation Banner -->
  <section class="py-5">
    <div class="container text-center" style="max-width: 680px;">
      
      <div class="bg-white border rounded p-4 p-md-5 shadow-sm">
        <i class="bi bi-check-circle-fill text-success display-2 mb-3 d-block"></i>
        
        <h1 class="font-heading display-6 mb-2">ORDER CONFIRMED</h1>
        <p class="lead text-muted mb-4">Thank you for shopping with Biodun Style Grid.</p>

        <div class="p-3 bg-light rounded text-start mb-4 border" id="orderConfirmationDetails">
          <!-- Rendered dynamically -->
        </div>

        <div class="d-flex justify-content-center gap-3">
          <a href="shop.html" class="btn btn-bsg-primary px-4 py-2">CONTINUE SHOPPING</a>
          <a href="account.html" class="btn btn-bsg-secondary px-4 py-2">VIEW ORDER</a>
        </div>
      </div>

    </div>
  </section>

  <!-- Footer -->
  <footer class="footer-bsg">
    <div class="container text-center small text-muted">
      <p class="mb-0">© 2026 BIODUN STYLE GRID (BSG). Prototype Netlify Build.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const ref = urlParams.get('ref');
      const latestOrder = JSON.parse(localStorage.getItem('bsg_latest_order')) || null;

      const container = document.getElementById('orderConfirmationDetails');

      if (!latestOrder) {
        container.innerHTML = `<p class="text-muted mb-0">Order reference: <strong>${ref || 'BSG-REF-PROTOTYPE'}</strong></p>`;
        return;
      }

      container.innerHTML = `
        <div class="d-flex justify-content-between mb-3 border-bottom pb-2">
          <span class="text-muted">Order Reference:</span>
          <strong class="font-monospace text-bsg-burgundy">${latestOrder.orderRef}</strong>
        </div>
        <div class="d-flex justify-content-between mb-3 border-bottom pb-2">
          <span class="text-muted">Customer Name:</span>
          <strong>${latestOrder.customer.name}</strong>
        </div>
        <div class="d-flex justify-content-between mb-3 border-bottom pb-2">
          <span class="text-muted">Payment Status:</span>
          <span class="badge bg-success">${latestOrder.paymentStatus}</span>
        </div>
        
        <h6 class="font-heading mt-3 mb-2">Purchased Items:</h6>
        <div class="d-flex flex-column gap-2 mb-3">
          ${latestOrder.items.map(item => `
            <div class="d-flex justify-content-between small">
              <span>${item.name} (Size: <strong>${item.size}</strong>, Color: <strong>${item.colour}</strong>, Qty: ${item.qty})</span>
              <strong class="ms-2">₦${(item.price * item.qty).toLocaleString()}</strong>
            </div>
          `).join('')}
        </div>

        <div class="d-flex justify-content-between fs-5 font-heading fw-bold border-top pt-2">
          <span>Total Amount Paid:</span>
          <span class="text-bsg-burgundy">₦${latestOrder.total.toLocaleString()}</span>
        </div>
      `;
    });
  </script>
</body>
</html>
